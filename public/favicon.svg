<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Pull-up bar -->
  <rect x="10" y="40" width="80" height="8" rx="4" fill="url(#grad)"/>
  <!-- Support posts -->
  <rect x="10" y="40" width="6" height="50" rx="3" fill="url(#grad)"/>
  <rect x="84" y="40" width="6" height="50" rx="3" fill="url(#grad)"/>
  <!-- Timer circle accent -->
  <circle cx="50" cy="25" r="8" fill="url(#grad)" opacity="0.8"/>
</svg>

